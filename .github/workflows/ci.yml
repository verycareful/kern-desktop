name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CI: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

      - name: Typecheck
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.node.json

      - name: ESLint
        run: npx eslint .

      - name: Prettier
        run: npx prettier --check .

      - name: Vitest
        run: npx vitest run

      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: No network APIs in source
        run: scripts/check-no-network.sh

      - name: Release-notes script tests
        run: python3 -I scripts/test_changelog_section.py

      - name: Build the deb
        run: npx tauri build --bundles deb

      # The built binary runs in a network namespace with no interfaces, under
      # a virtual display. It must still be running when timeout stops it
      # (exit 124); any other status is a crash.
      - name: Smoke run without network
        run: |
          set +e
          timeout 5 unshare -rn xvfb-run -a src-tauri/target/release/kern
          status=$?
          set -e
          if [ "$status" -ne 124 ]; then
            echo "::error::kern exited with status $status before the timeout"
            exit 1
          fi
