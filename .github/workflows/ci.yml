name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Tauri CLI reads CI as its --ci flag, which takes true or false.
  CI: "true"

jobs:
  check:
    runs-on: ubuntu-24.04
    # Every step has a limit of its own, so a hang costs that step's limit and
    # not the job's. Measured on a runner with nothing cached: the job takes
    # 18 minutes, the Rust tests 3, the release-mode timing tests 8.5 (the
    # longest step, limit 30), Clippy 1.6, the deb build 1.2 and everything
    # else under a minute each. The job limit is over three times the whole.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 5

      - name: System libraries for Tauri
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb \
            desktop-file-utils appstream webkit2gtk-driver dbus libglib2.0-bin xauth

      - uses: dtolnay/rust-toolchain@stable
        timeout-minutes: 5
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v7
        timeout-minutes: 5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        timeout-minutes: 10

      - name: Format
        timeout-minutes: 5
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Clippy
        timeout-minutes: 15
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Rust tests
        timeout-minutes: 15
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-features

      - name: Timing budgets (release build)
        timeout-minutes: 30
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --all-features -- --ignored

      - name: cargo-deny
        timeout-minutes: 10
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml

      - name: Typecheck
        timeout-minutes: 5
        run: |
          npx tsc --noEmit
          npx tsc -p tsconfig.node.json
          npx tsc -p e2e-app

      - name: ESLint
        timeout-minutes: 5
        run: npx eslint .

      - name: Prettier
        timeout-minutes: 5
        run: npx prettier --check .

      - name: Vitest
        timeout-minutes: 5
        run: npx vitest run

      - name: Playwright
        timeout-minutes: 15
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: No network APIs in source
        timeout-minutes: 5
        run: scripts/check-no-network.sh

      - name: Source file headers
        timeout-minutes: 5
        run: scripts/check-headers.sh

      - name: Header check tests
        timeout-minutes: 5
        run: python3 -I scripts/test_check_headers.py

      - name: Release-notes script tests
        timeout-minutes: 5
        run: python3 -I scripts/test_changelog_section.py

      - name: Desktop entry and metainfo
        timeout-minutes: 15
        run: python3 -I scripts/test_desktop_entry.py

      - name: Build the deb
        timeout-minutes: 30
        run: npx tauri build --bundles deb

      # The driver is part of the test harness and listens on localhost; the
      # application it drives opens no socket. The version is pinned.
      - name: tauri-driver
        timeout-minutes: 20
        run: cargo install tauri-driver --locked --version 2.1.0

      - name: Debug build for the driver suite
        timeout-minutes: 30
        run: npx tauri build --debug --no-bundle

      # Each spec file runs under its own session bus and home directory
      # (e2e-app/run.sh). The runner forbids unprivileged user namespaces,
      # which the WebKitGTK sandbox needs, so the sandbox is off for this step
      # and this step only.
      - name: Driver suite
        timeout-minutes: 20
        env:
          KERN_E2E_NO_BUILD: "1"
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
        run: e2e-app/run.sh

      # The runner forbids unprivileged user namespaces, so the empty network
      # namespace is made as root; setpriv then drops back to the runner user
      # before anything else runs, so Kern itself is unprivileged.
      - name: Network namespace for the smoke run
        timeout-minutes: 2
        run: |
          if ! sudo unshare -n setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups true; then
            echo "::error::cannot create a network namespace on this runner"
            exit 1
          fi

      # The built binary runs in a network namespace with no interfaces, under
      # a virtual display. It must still be running when timeout stops it
      # (exit 124); any other status is a crash. Its output is then searched
      # for a failed lookup or an unreachable network: in an empty namespace
      # even a connection to loopback fails with "Network is unreachable", so
      # any attempt to use the network leaves one of these.
      - name: Smoke run without network
        timeout-minutes: 5
        run: |
          log="$RUNNER_TEMP/kern-smoke.log"
          set +e
          timeout 5 sudo unshare -n setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
            env HOME="$HOME" PATH="$PATH" xvfb-run -a src-tauri/target/release/kern >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          if [ "$status" -ne 124 ]; then
            echo "::error::kern exited with status $status before the timeout"
            exit 1
          fi
          if grep -Ei 'network is unreachable|name or service not known|temporary failure in name resolution|no route to host|ENETUNREACH|EHOSTUNREACH|getaddrinfo|failed to lookup address' "$log"; then
            echo "::error::kern's output names a network error"
            exit 1
          fi
