# Publishes a GitHub Release for a version tag, with the notes taken from the
# matching CHANGELOG.md section so the release page and the changelog are the
# same text. The deb and the AppImage are built from the tag and attached,
# with uninstall.sh and SHA256SUMS over the three: install.sh reads the file
# names from SHA256SUMS and checks every download against it.
#
# Separate from ci.yml: it fires only when a version tag is pushed, or when it
# is dispatched by hand to publish an existing tag.
#
# Only the newest version tag publishes. Several tags can arrive in one push
# (a patch series tagged locally and pushed together), and each starts its own
# run; the runs for older tags see a newer tag and stop. The release notes are
# every CHANGELOG.md section newer than the previous published release, up to
# the tag, so a series that publishes once still lists all of its changes.
# GitHub starts no run at all when more than three tags arrive in one push; the
# manual dispatch with the newest tag publishes that case.
name: Release

on:
  push:
    # Four-component version tags only, e.g. 0.1.1.0, with no prefix. A tag
    # that is not a version publishes nothing.
    tags:
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish a release for"
        required: true
        type: string

# Creating a release writes to the repository; nothing else needs a token.
permissions:
  contents: write

jobs:
  plan:
    name: choose what to publish
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      since: ${{ steps.plan.outputs.since }}
    steps:
      # since is the newest published release older than the tag, empty when
      # there is none. A dispatched tag always publishes; a pushed tag
      # publishes only when no newer version tag exists.
      - name: Resolve the tag, whether it is the newest, and the previous release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          version='^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ $version ]]; then
            echo "::error::$tag is not a four-part version tag"
            exit 1
          fi

          publish=true
          if [ "$EVENT" = push ]; then
            newest=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags" \
                       --paginate --jq '.[].ref' \
                     | sed 's#^refs/tags/##' | grep -E "$version" \
                     | sort -V | tail -n 1)
            if [ "$newest" != "$tag" ]; then
              publish=false
              echo "::notice::$tag is not the newest version tag ($newest is), so it publishes nothing"
            fi
          fi

          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 \
                       --exclude-drafts --json tagName --jq '.[].tagName' \
                     | grep -E "$version" || true)
          since=$(printf '%s\n%s\n' "$releases" "$tag" | grep -v '^$' | sort -Vu \
                  | grep -x -B1 -- "$tag" | sed -n 1p)
          if [ "$since" = "$tag" ]; then
            since=
          fi

          {
            echo "tag=$tag"
            echo "publish=$publish"
            echo "since=$since"
          } >> "$GITHUB_OUTPUT"
          echo "tag: $tag  publish: $publish  previous release: ${since:-none}"

  release:
    name: publish release
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      SINCE: ${{ needs.plan.outputs.since }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The tag must name the tree it points at: VERSION holds the full label.
      - name: Check the tag matches the tree
        run: |
          TREE=$(cat VERSION)
          echo "tag:  $TAG"
          echo "tree: $TREE"
          if [ "$TAG" != "$TREE" ]; then
            echo "::error::tag $TAG does not match VERSION $TREE"
            exit 1
          fi

      # Every section newer than the previous release, up to this tag. Fails
      # when the tag's own section is missing or empty, so a release page is
      # never published with nothing on it.
      - name: Extract release notes from CHANGELOG.md
        run: |
          if [ -n "$SINCE" ]; then
            python3 -I scripts/changelog_section.py --since "$SINCE" "$TAG" CHANGELOG.md \
              > release-notes.md
          else
            python3 -I scripts/changelog_section.py "$TAG" CHANGELOG.md \
              > release-notes.md
          fi
          echo "notes that will be published:"
          cat release-notes.md

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev xdg-utils

      # Install scripts are off: nothing in the build needs one.
      - run: npm ci --ignore-scripts

      - name: Build the deb and the AppImage
        run: npx tauri build --bundles deb,appimage

      # One deb and one AppImage, or the checksums would name a file the
      # installer cannot choose between. The bundler names them after the
      # Cargo version (0.1.0+0); GitHub rewrites special characters in asset
      # names, so they are published under the tag instead
      # (io.github.verycareful.kern_0.1.0.0_amd64.deb), and SHA256SUMS names
      # exactly the files that are uploaded.
      - name: Collect the assets and their checksums
        run: |
          mkdir assets
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          images=(src-tauri/target/release/bundle/appimage/*.AppImage)
          if [ "${#debs[@]}" -ne 1 ] || [ "${#images[@]}" -ne 1 ]; then
            echo "::error::expected one deb and one AppImage, found ${#debs[@]} and ${#images[@]}"
            exit 1
          fi
          app_id=$(jq -r .identifier src-tauri/tauri.conf.json)
          cp "${debs[0]}" "assets/${app_id}_${TAG}_amd64.deb"
          cp "${images[0]}" "assets/${app_id}_${TAG}_amd64.AppImage"
          cp uninstall.sh assets/
          (cd assets && sha256sum -- *.deb *.AppImage uninstall.sh > SHA256SUMS)
          cat assets/SHA256SUMS

      # The release is created with every asset in one call, so the latest
      # release never lacks the SHA256SUMS the installer reads first. gh ships
      # on the runner, so no third-party action is needed.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --verify-tag \
            assets/*
