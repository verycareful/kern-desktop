[package]
name = "kern"
version = "0.1.0+0.6"
description = "Kern for Linux: a file manager and document viewer"
license = "AGPL-3.0-or-later"
publish = false
edition = "2021"

[lib]
name = "kern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rustix = { version = "1", features = ["fs"] }
kernkraft-tauri = { git = "https://github.com/verycareful/kernkraft", rev = "d4b0ef4c7bee929bdd188ea09b299d264165126b" }
kernkraft-fs = { git = "https://github.com/verycareful/kernkraft", rev = "d4b0ef4c7bee929bdd188ea09b299d264165126b" }
kernkraft-theme = { git = "https://github.com/verycareful/kernkraft", rev = "d4b0ef4c7bee929bdd188ea09b299d264165126b" }
kernkraft-bus = { git = "https://github.com/verycareful/kernkraft", rev = "d4b0ef4c7bee929bdd188ea09b299d264165126b" }
tauri-plugin-window-state = "2"
# Only for the interface macro and message types; connections come from kernkraft-bus.
zbus = "5"
# Must be the gtk that tauri-runtime-wry uses: one GTK binding per process.
gtk = "=0.18.2"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }
